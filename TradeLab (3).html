<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0f14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TradeLab">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>TradeLab</title>
<style>
:root{color-scheme:dark;--bg:#0a0f14;--card:#141c24;--card2:#1d2832;--tx:#eef3f7;--mu:#8a98a6;--up:#22c7a9;--dn:#f0564f;--ac:#ffd500;--bd:#26323d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){color-scheme:light;--bg:#f2f5f8;--card:#fff;--card2:#e6ecf1;--tx:#101820;--mu:#5d6b78;--up:#0e9f86;--dn:#d6403a;--ac:#e6b800;--bd:#d3dbe2}}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:480px;margin:0 auto;height:100%;position:relative;overflow:hidden}
#view{height:100%;overflow-y:auto;padding:14px 16px 90px}
h1{font-size:28px;margin:8px 0 14px}h2{font-size:17px;margin:20px 0 10px}
.card{background:var(--card);border-radius:16px;padding:16px}
.mu{color:var(--mu)}.up{color:var(--up)}.dn{color:var(--dn)}
.big{font-size:34px;font-weight:700;margin:8px 0 14px}
.tag{display:inline-block;background:var(--card2);border-radius:99px;padding:4px 10px;font-size:12px;margin-right:6px;margin-bottom:4px}
.acts{display:flex;justify-content:space-between}
.acts div{text-align:center;font-size:12px}
.acts button{width:54px;height:54px;border-radius:50%;border:0;background:var(--card2);color:var(--tx);font-size:20px;display:block;margin:0 auto 6px;cursor:pointer}
.acts button.p{background:var(--ac);color:#04110e}
.row{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px;cursor:pointer}
.row b{font-size:16px}.row small{display:block;color:var(--mu);margin-top:3px}.r{text-align:right}
.hs{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.mini{min-width:130px;background:var(--card);border-radius:14px;padding:14px;text-align:center;cursor:pointer}
.pill{display:inline-block;border-radius:99px;padding:3px 10px;font-size:13px;margin-top:6px;background:var(--card2)}
.seg{display:flex;gap:18px;border-bottom:1px solid var(--bd);margin:18px 0 12px}
.seg span{padding:8px 0;color:var(--mu);cursor:pointer}.seg .on{color:var(--tx);border-bottom:2px solid var(--ac)}
#bar{position:absolute;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
#bar div{flex:1;text-align:center;padding:10px 0 8px;font-size:11px;color:var(--mu);cursor:pointer}
#bar div i{display:block;font-style:normal;font-size:20px}#bar .on{color:var(--ac)}
#chart{position:absolute;inset:0;background:var(--bg);z-index:5;display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#chart .top{display:flex;justify-content:space-between;align-items:center;padding:12px 16px}
#chart button.x{background:var(--card2);color:var(--tx);border:0;border-radius:10px;padding:8px 14px;font-size:15px}
canvas{flex:1;width:100%;min-height:0;touch-action:none}#modal{position:absolute;inset:0;background:#0009;z-index:8;display:none;align-items:flex-end}#modal .sheet{background:var(--card);width:100%;border-radius:20px 20px 0 0;padding:22px 16px calc(22px + env(safe-area-inset-bottom,0px))}
.trade{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--card)}
.lots{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:10px}
.lots button{width:38px;height:38px;border-radius:50%;border:0;background:var(--card2);color:var(--tx);font-size:20px}
.bs{display:flex;gap:10px}
.bs button{flex:1;border:0;border-radius:12px;padding:12px;color:#fff;font-size:15px;font-weight:600}
.sell{background:var(--dn)}.buy{background:#2a86ff}
.pos{background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.pos button{background:var(--card2);color:var(--tx);border:0;border-radius:8px;padding:6px 10px;margin-left:10px}
.sw{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--bd)}
.btn{background:var(--ac);color:#04110e;border:0;border-radius:10px;padding:12px 20px;font-weight:600;font-size:15px;cursor:pointer}
#toast{position:absolute;left:50%;top:60px;transform:translateX(-50%);background:var(--card2);padding:10px 16px;border-radius:10px;font-size:14px;z-index:12;display:none;max-width:90%;box-shadow:0 4px 16px #0006}
.tfs{display:flex;gap:8px;padding:0 16px 8px}.tfs span{padding:6px 14px;border-radius:99px;background:var(--card2);color:var(--mu);font-size:13px;cursor:pointer}.tfs .on{background:var(--ac);color:#04110e;font-weight:600}
.tpsl{display:flex;gap:10px;margin-bottom:10px}.tpsl label{flex:1;font-size:12px;color:var(--mu)}.in{width:100%;margin-top:4px;background:var(--card2);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:10px;font-size:15px}
.pos .ts{display:block;font-size:12px;margin-top:3px}
.ps{display:flex;justify-content:space-between;align-items:center;background:var(--card);margin:0 12px 8px;padding:10px 14px;border-radius:12px;font-size:14px}
#auth{position:absolute;inset:0;z-index:7;background:var(--bg);overflow-y:auto;display:none;padding:calc(env(safe-area-inset-top,0px) + 8px) 24px 24px}.aw{max-width:400px;margin:40px auto 0}.aw label{display:block;margin-top:12px;font-size:13px;color:var(--mu)}.aw .btn{width:100%;padding:14px}.lg{width:64px;height:64px;border-radius:18px;background:var(--ac);display:flex;align-items:center;justify-content:center;font-size:32px;margin-bottom:18px}
#tc{position:absolute;left:0;right:0;bottom:0;z-index:8;display:none;background:var(--card);border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 24px #0008}
#pm,#os,#cc,#wl,#imgv{position:absolute;inset:0;background:#0009;z-index:8;display:none;align-items:flex-end}#pm .sheet,#os .sheet,#cc .sheet,#wl .sheet{max-height:92%;overflow-y:auto;background:var(--card);width:100%;border-radius:20px 20px 0 0;padding:22px 16px calc(22px + env(safe-area-inset-bottom,0px))}
#imgv{z-index:11;align-items:center;justify-content:center;padding:20px;background:#000d}
.spin{width:18px;height:18px;border:2px solid var(--card2);border-top-color:var(--ac);border-radius:50%;animation:sp .8s linear infinite;display:inline-block;flex:none}@keyframes sp{to{transform:rotate(360deg)}}.pb{height:6px;background:var(--card2);border-radius:9px;overflow:hidden;margin:6px 0 16px}.pb i{display:block;height:100%;background:var(--ac);border-radius:9px;transition:width .9s ease}.ok{width:72px;height:72px;border-radius:50%;background:var(--up);color:#04110e;font-size:38px;display:flex;align-items:center;justify-content:center;margin:8px auto 14px;animation:pop .4s}.ok.bad{background:var(--dn);color:#fff}@keyframes pop{from{transform:scale(.3);opacity:0}}.ls{display:flex;align-items:center;gap:12px;padding:11px 0;font-size:15px}.ls .d{width:18px;height:18px;border-radius:50%;flex:none;text-align:center;font-size:12px;line-height:18px}
.paybox{background:var(--card2);border-radius:12px;padding:12px;margin:10px 0;border:1px solid var(--bd)}
.copybtn{background:var(--ac);color:#04110e;border:0;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer}
.smbtn{border:0;border-radius:8px;padding:7px 12px;font-size:12px;font-weight:600;cursor:pointer}
.proofcard{background:var(--card2);border-radius:12px;padding:12px;margin-bottom:10px;border:1px solid var(--bd)}
.thumb{max-width:100%;max-height:130px;border-radius:8px;margin-top:8px;border:1px solid var(--bd);display:block;cursor:pointer}
</style></head><body>
<div id="app"><div id="view"></div>
<div id="bar"></div>
<div id="chart"><div class="top"><button class="x" onclick="closeChart()">← Back</button><b id="ct"></b><span id="cb" class="mu"></span></div>
<div id="ps" class="ps"></div><div class="tfs" id="tfs"></div>
<canvas id="cv"></canvas>
<div class="trade"><div class="lots"><button onclick="lotAdj(-1)">−</button><b id="lt"></b><button onclick="lotAdj(1)">+</button><span class="mu">lots</span></div>
<div class="tpsl"><label>Take Profit (TP)<input class="in" id="tp" type="number" step="any" inputmode="decimal" placeholder="Price"></label><label>Stop Loss (SL)<input class="in" id="sl" type="number" step="any" inputmode="decimal" placeholder="Price"></label></div><div id="mg" class="mu" style="text-align:center;font-size:13px;margin-bottom:10px"></div><div class="bs"><button class="sell" id="bsell" onclick="askPos(-1)"></button><span id="spr" class="tag" style="align-self:center;margin:0 -8px;z-index:1;font-size:11px"></span><button class="buy" id="bbuy" onclick="askPos(1)"></button></div>
<div id="cpos" style="margin-top:10px"></div></div></div>
<div id="modal" onclick="if(event.target==this)modal(0)"><div class="sheet"><h2 style="margin:0 0 8px;text-align:center">Not Enough Money</h2><p class="mu" style="text-align:center">Margin required for the entered order volume exceeds the available free margin on your account.</p><div style="display:flex;gap:10px;margin-top:18px"><button class="btn" style="flex:1" onclick="dep()">Deposit</button><button class="btn" style="flex:1;background:var(--card2);color:var(--tx)" onclick="modal(0)">Cancel</button></div></div></div><div id="auth"></div><div id="toast"></div><div id="wl" onclick="if(event.target==this)wClose()"><div class="sheet" id="wlb"></div></div><div id="os" onclick="if(event.target==this)osClose()"><div class="sheet"><div class="seg" style="margin:0 0 14px"><span class="on">Market</span><span onclick="toast('Pending orders coming soon')">Pending</span></div><div id="osb"></div><div style="display:flex;gap:10px;margin-top:6px"><button class="btn" style="flex:1;background:var(--card2);color:var(--tx)" onclick="osClose()">Cancel</button><button class="btn" id="cfm" style="flex:2;color:#fff" onclick="osGo()"></button></div></div></div><div id="cc" onclick="if(event.target==this)ccClose()"><div class="sheet"><h2 id="cct" style="margin:0 0 14px;text-align:center"></h2><div id="ccb"></div><button class="btn" style="width:100%;margin-top:14px" onclick="ccGo()">Confirm</button><button class="btn" style="width:100%;margin-top:10px;background:var(--card2);color:var(--tx)" onclick="ccClose()">Cancel</button></div></div><div id="tc"><div id="tcb"></div><div style="display:flex;gap:10px;margin-top:14px"><button class="btn" style="flex:1;background:var(--card2);color:var(--tx)" onclick="tcCancel()">Cancel</button><button class="btn" style="flex:2" onclick="tcOk()">Confirm</button></div></div><div id="pm" onclick="if(event.target==this)pmClose()"><div class="sheet"><h2 id="pmt" style="margin:0 0 12px;text-align:center"></h2><div class="tpsl"><label>Take Profit (TP)<input class="in" id="etp" type="number" step="any" inputmode="decimal" placeholder="None"></label><label>Stop Loss (SL)<input class="in" id="esl" type="number" step="any" inputmode="decimal" placeholder="None"></label></div><div style="display:flex;gap:10px"><button class="btn" style="flex:1" onclick="pmSave()">Save</button><button class="btn" style="flex:1;background:var(--card2);color:var(--tx)" onclick="pmClose()">Cancel</button></div></div></div>
<div id="imgv" onclick="this.style.display='none'"><div style="text-align:center;max-width:100%"><img id="imgv_el" style="max-width:100%;max-height:80vh;border-radius:12px"><p class="mu" style="margin-top:10px;font-size:13px">Tap anywhere to close</p></div></div>
</div>
<script>
const $=s=>document.querySelector(s);
const TF={"1m":8,"5m":40,"1h":480},TM={"1m":1,"5m":2.2,"1h":7};
function gen(p,v){const c=[];let x=p;for(let i=0;i<200;i++){const o=x;x*=1+(Math.random()-.47)*v*2;c.push({o:o,h:Math.max(o,x)*(1+Math.random()*v),l:Math.min(o,x)*(1-Math.random()*v),c:x})}
const f=p/x;c.forEach(q=>{q.o*=f;q.h*=f;q.l*=f;q.c*=f});return c}
function mk(k,n,p,d,m,v,s){const C={};for(const t in TF)C[t]=gen(p,v*TM[t]);return{k,n,p,d,m,v,s,o:C["1m"][0].o,C,tf:"1m",t:0,z:50,off:0,get c(){return this.C[this.tf]}}}
const S=[mk("XAU/USD","Gold vs US Dollar",3645.7,2,100,.0004,.03),mk("BTC/USD","Bitcoin vs US Dollar",60362,2,1,.0012,15),mk("TECH100","US Tech 100 Index",26314.5,1,1,.0006,2),mk("EUR/USD","Euro vs US Dollar",1.09623,5,100000,.0002,.00012),mk("OIL","Crude Oil",80.085,3,1000,.0005,.03),mk("US30","US Wall Street 30 Index",49415,1,10,.0005,3)];
let tab="acc",cur=null,bal=10000,pos=[],closed=[],lot=.01,pid=1,sub="open",liveOn=false;
const f=(v,d)=>v.toFixed(d),sg=v=>(v>=0?"+":"")+v.toFixed(2),cl=v=>v>=0?"up":"dn";
const chg=s=>(s.p/s.o-1)*100;
const pnl=q=>{const s=S[q.i];return q.dir*((q.dir>0?s.p:s.p+s.s)-q.o)*q.lot*s.m*(q.dir>0?1:1)};
const float=()=>pos.reduce((a,q)=>a+pnl(q),0);
function spark(s){const a=s.C["1m"].slice(-30).map(x=>x.c),mn=Math.min(...a),mx=Math.max(...a)||1;const pts=a.map((v,i)=>(i*100/29).toFixed(1)+","+(28-(v-mn)/((mx-mn)||1)*26).toFixed(1)).join(" ");return `<svg width="90" height="30" viewBox="0 0 100 30"><polyline fill="none" stroke="${chg(s)>=0?"var(--up)":"var(--dn)"}" stroke-width="2" points="${pts}"/></svg>`}
function toast(t){const e=$("#toast");e.textContent=t;e.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display="none",2200)}
function setTab(t){tab=t;render()}
function bar(){const T=[["acc","▦","Accounts"],["trade","⇅","Trade"],["ins","◎","Insights"],["perf","▥","Performance"],["prof","☺","Profile"]];$("#bar").innerHTML=T.map(x=>`<div class="${tab==x[0]?"on":""}" onclick="setTab('${x[0]}')"><i>${x[1]}</i>${x[2]}</div>`).join("")}
function tile(i){const s=S[i],c=chg(s);return `<div class="mini" onclick="openChart(${i})"><b>${s.k}</b><div style="margin:8px 0">${f(s.p,s.d)}</div><span class="pill ${cl(c)}">${c>=0?"↑":"↓"} ${Math.abs(c).toFixed(2)}%</span></div>`}
function listRow(i){const s=S[i],c=chg(s);return `<div class="row" onclick="openChart(${i})"><div><b>${s.k}</b><small>${s.n}</small></div>${spark(s)}<div class="r"><b>${f(s.p,s.d)}</b><small class="${cl(c)}">${c>=0?"↑":"↓"} ${Math.abs(c).toFixed(2)}%</small></div></div>`}
function posRow(q,x){const s=S[q.i],p=pnl(q);return `<div class="pos"><div><b>${s.k}</b> <span class="${q.dir>0?"up":"dn"}">${q.dir>0?"BUY":"SELL"}</span><small class="mu" style="display:block">${q.lot} lots @ ${f(q.o,s.d)}</small><small class="ts mu">TP ${q.tp!=null?f(q.tp,s.d):"—"} · SL ${q.sl!=null?f(q.sl,s.d):"—"}</small></div><div><b class="${cl(p)}">${sg(p)} USD</b><button onclick="editTS(${q.id})">TP/SL</button><button onclick="askClose(${q.id})">Close order</button></div></div>`}
function syncLive(sym,np){const s=S.find(x=>x.k==sym);if(!s||!(np>0))return;const ratio=np/s.p;s.p=np;if(!s.liveInit){s.o=np;s.liveInit=true}for(const k in TF){s.C[k].forEach(c=>{c.o*=ratio;c.h*=ratio;c.l*=ratio;c.c*=ratio});const last=s.C[k][s.C[k].length-1];last.c=np;last.h=Math.max(last.h,np);last.l=Math.min(last.l,np)}s.man=false}
async function fetchLive(){let ok=false;
try{const r=await fetch("https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT");if(r.ok){const d=await r.json();if(+d.price>0){syncLive("BTC/USD",+d.price);ok=true}}}catch(e){}
try{const r=await fetch("https://api.frankfurter.app/latest?from=EUR&to=USD");if(r.ok){const d=await r.json();if(d.rates&&+d.rates.USD>0){syncLive("EUR/USD",+d.rates.USD);ok=true}}}catch(e){}
try{const r=await fetch("https://open.er-api.com/v6/latest/USD");if(r.ok){const d=await r.json();if(d.rates&&+d.rates.XAU>0){syncLive("XAU/USD",1/+d.rates.XAU);ok=true}}}catch(e){}
liveOn=ok;if(cur!=null){draw();upd()}}
fetchLive();setInterval(fetchLive,10000);

const DEF_PAY={bkash:"01700000000",nagad:"01800000000",usdt:"T9yD14Nj9j7xAB4dbGeiX9h8unkKHxuWwb",pin:"1234",auto:false};
function getPayCfg(){try{return Object.assign({},DEF_PAY,JSON.parse(localStorage.getItem("tl_pay_cfg")||"{}"))}catch(e){return {...DEF_PAY}}}
function savePayCfg(c){try{localStorage.setItem("tl_pay_cfg",JSON.stringify(c))}catch(e){}}
function getReqs(){try{return JSON.parse(localStorage.getItem("tl_pay_reqs")||"[]")}catch(e){return[]}}
function saveReqs(r){try{localStorage.setItem("tl_pay_reqs",JSON.stringify(r.slice(0,40)))}catch(e){}}
function copyTxt(txt){if(navigator.clipboard)navigator.clipboard.writeText(txt).then(()=>toast("Copied: "+txt)).catch(()=>toast("Number: "+txt));else toast("Number: "+txt)}
function viewImg(src){$("#imgv_el").src=src;$("#imgv").style.display="flex"}

function render(){bar();const v=$("#view");let h="";
const pCnt=getReqs().filter(r=>r.st=="pending").length;
if(tab=="acc"){const eq=bal+float();h=`<div class="card" style="margin-top:12px"><b>${mode=="demo"?"Demo":"Real"} account #${mode=="demo"?"100001":"100002"}</b><div style="margin-top:8px"><span class="tag" style="cursor:pointer;${mode=="demo"?"background:var(--ac);color:#04110e":""}" onclick="sw('demo')">Demo</span><span class="tag" style="cursor:pointer;${mode=="real"?"background:var(--ac);color:#04110e":""}" onclick="sw('real')">Real</span><span class="tag" style="cursor:pointer;border:1px solid var(--ac)" onclick="admGate()">⚙ Admin${pCnt?` (${pCnt})`:""}</span><span class="tag">Standard</span>${mode=="real"?`<span class="tag" style="cursor:pointer" onclick="wHist()">History</span>`:""}<span class="tag">${liveOn?"Live feed":"Sim feed"}</span></div><div class="big">${f(eq,2)} USD</div><div class="acts"><div><button class="p" onclick="setTab('trade')">⇅</button>Trade</div><div><button onclick="wOpen('dep')">↓</button>Deposit</div><div><button onclick="wOpen('wd')">↑</button>Withdraw</div><div><button onclick="toast('Demo only: no real money')">⇄</button>Transfer</div></div></div>
<div class="seg"><span class="${sub=="open"?"on":""}" onclick="sub='open';render()">Open (${pos.length})</span><span class="${sub=="closed"?"on":""}" onclick="sub='closed';render()">Closed (${closed.length})</span></div>`;
if(sub=="open")h+=pos.length?pos.map(posRow).join(""):`<p class="mu" style="margin-bottom:10px">No open orders. Find your next trade:</p><div class="hs">${[0,1,2].map(tile).join("")}</div>`;
else h+=closed.length?closed.slice().reverse().map(q=>`<div class="pos"><div><b>${S[q.i].k}</b> <span class="${q.dir>0?"up":"dn"}">${q.dir>0?"BUY":"SELL"}</span><small class="mu" style="display:block">${q.lot} lots${q.r?" · "+q.r:""}</small></div><b class="${cl(q.p)}">${sg(q.p)} USD</b></div>`).join(""):`<p class="mu">No closed trades yet.</p>`}
else if(tab=="trade")h=`<h1>Trade</h1><div class="tag">${liveOn?"Live + Sim prices":"Most traded"}</div><div style="height:12px"></div>`+S.map((s,i)=>listRow(i)).join("");
else if(tab=="ins"){const m=S.map((s,i)=>i).sort((a,b)=>Math.abs(chg(S[b]))-Math.abs(chg(S[a])));h=`<h1>Insights</h1><h2>Top movers</h2><div class="hs">${m.map(tile).join("")}</div><h2>Trading signals</h2><div class="card"><b>XAU/USD: bullish while above 3,620</b><p class="mu" style="margin:6px 0">Sample text for the demo only. Not a real signal.</p><span class="pill up">↑ Intraday</span></div><div class="card" style="margin-top:10px"><b>OIL: choppy, range-bound</b><p class="mu" style="margin:6px 0">Sample text for the demo only. Not a real signal.</p><span class="pill dn">↓ Intraday</span></div><h2>Upcoming events</h2><div class="row"><div><b>PL M3 Money Supply YoY</b><small>7:00 PM · in 11 minutes</small></div></div><div class="row"><div><b>US Consumer Confidence</b><small>8:00 PM · in 1 hour</small></div></div>`}
else if(tab=="perf"){const t=closed.reduce((a,q)=>a+q.p,0),w=closed.filter(q=>q.p>0).length;h=`<h1>Performance</h1>`+(closed.length?`<div class="card"><div class="mu">Total P/L</div><div class="big ${cl(t)}">${sg(t)} USD</div><div class="acts"><div><b>${closed.length}</b><br><span class="mu">Trades</span></div><div><b>${Math.round(w/closed.length*100)}%</b><br><span class="mu">Win rate</span></div><div><b>${w}/${closed.length-w}</b><br><span class="mu">Win/Loss</span></div></div></div>`:`<div class="card" style="text-align:center;padding:40px 16px"><div style="font-size:34px">⚠</div><b>No trading activity found</b><p class="mu" style="margin:8px 0 16px">Close a trade to see stats.</p><button class="btn" onclick="setTab('trade')">Trade</button></div>`)}

me={n:USERS[e].n,e};try{localStorage.setItem("tl_s",e)}catch(x){}$("#auth").style.display="none";tab="acc";render();loadReal();toast(am=="up"?"Account created. Welcome!":"Welcome back, "+me.n)}

const sleep=t=>new Promise(r=>setTimeout(r,t)),AMT=[100,500,1000,5000],MT=[["bkash","🩷","bKash","Send Money / Cash Out (Simulated)"],["nagad","🧡","Nagad","Send Money / Cash Out (Simulated)"],["usdt","🪙","USDT (TRC20)","Crypto Transfer (Simulated)"]];
let RTX=[],W=null,lastB=null,admUnlocked=false,admTab="req";
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rk=e=>"tl_r_"+e;

async function rSave(){if(!me)return;const e=me.e,o={bal:mode=="real"?bal:AC.real.bal,tx:RTX.slice(0,50)};try{localStorage.setItem(rk(e),JSON.stringify(o))}catch(x){}}
async function loadReal(){if(!me)return;const e=me.e;let o=null;try{o=JSON.parse(localStorage.getItem(rk(e))||"null")}catch(x){}if(o&&me&&me.e==e){AC.real.bal=+o.bal||0;RTX=Array.isArray(o.tx)?o.tx:[];if(mode=="real")bal=AC.real.bal;lastB=bal;if(tab=="acc"&&cur==null)render()}}
setInterval(()=>{if(me&&mode=="real"&&bal!==lastB){lastB=bal;rSave()}},4000);

const wb=h=>{$("#wlb").innerHTML=h;$("#wl").style.display="flex"},mx=()=>Math.max(0,Math.floor(Math.min(free(),bal)*100)/100),mn=id=>MT.find(m=>m[0]==id)[2];
function wOpen(k){if(mode!="real"){if(k=="dep")dep();else toast("Withdraw works on the Real account. Tap the Real tag to switch.");return}W={k,st:1,a:"",m:null,trx:"",img:"",acc:""};wGo(1)}
function wClose(){if(W&&W.busy)return;W=null;$("#wl").style.display="none";render()}

function admGate(){
  if(admUnlocked){admOpen();return}
  W={k:"gate"};
  wb(`<span class="tag" style="margin:0 0 10px">ADMIN ACCESS</span>
  <h2 style="margin:0 0 8px">Enter Admin PIN</h2>
  <p class="mu" style="font-size:13px;margin-bottom:12px">Default PIN is <b>1234</b> (you can change it inside Admin Panel).</p>
  <input class="in" id="admpin" type="password" inputmode="numeric" placeholder="Enter PIN">
  <div style="display:flex;gap:10px;margin-top:16px">
    <button class="btn" style="flex:1;background:var(--card2);color:var(--tx)" onclick="wClose()">Cancel</button>
    <button class="btn" style="flex:2" onclick="chkAdmPin()">Unlock Admin</button>
  </div>`);
}
function chkAdmPin(){
  const cfg=getPayCfg(),v=($("#admpin").value||"").trim();
  if(v===cfg.pin){admUnlocked=true;admOpen()}
  else toast("Wrong Admin PIN");
}

function admOpen(){
  W={k:"a"};
  const cfg=getPayCfg(),reqs=getReqs();
  const pendReqs=reqs.filter(r=>r.st=="pending");
  let body=`<span class="tag" style="margin:0 0 10px">SIMULATED · Admin Control</span>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
    <h2 style="margin:0">Admin Panel</h2>
    <span class="tag" style="cursor:pointer" onclick="admUnlocked=false;wClose()">Lock 🔒</span>
  </div>
  <div class="seg" style="margin:6px 0 14px">
    <span class="${admTab=='req'?'on':''}" onclick="admTab='req';admOpen()">Requests (${pendReqs.length})</span>
    <span class="${admTab=='pay'?'on':''}" onclick="admTab='pay';admOpen()">Payment Numbers</span>
    <span class="${admTab=='usr'?'on':''}" onclick="admTab='usr';admOpen()">Users</span>
  </div>`;

  if(admTab=="pay"){
    body+=`<label class="mu" style="font-size:13px">🩷 bKash Number</label>
    <input class="in" id="cfg_bkash" value="${esc(cfg.bkash)}" placeholder="017XXXXXXXX" style="margin-bottom:10px">
    <label class="mu" style="font-size:13px">🧡 Nagad Number</label>
    <input class="in" id="cfg_nagad" value="${esc(cfg.nagad)}" placeholder="018XXXXXXXX" style="margin-bottom:10px">
    <label class="mu" style="font-size:13px">🪙 USDT (TRC20) Address</label>
    <input class="in" id="cfg_usdt" value="${esc(cfg.usdt)}" placeholder="TRC20 Wallet Address" style="margin-bottom:10px">
    <label class="mu" style="font-size:13px">🔑 Admin PIN</label>
    <input class="in" id="cfg_pin" value="${esc(cfg.pin)}" placeholder="1234" style="margin-bottom:12px">
    <label style="display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:14px;cursor:pointer">
      <input type="checkbox" id="cfg_auto" ${cfg.auto?"checked":""}> Auto-approve deposits immediately (skip manual check)
    </label>
    <button class="btn" style="width:100%" onclick="saveAdmPay()">Save Payment Settings</button>`;
  } else if(admTab=="req"){
    if(!reqs.length){
      body+=`<p class="mu" style="text-align:center;padding:24px 0">No deposit requests yet.</p>`;
    } else {
      body+=reqs.map(r=>`<div class="proofcard">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <b>${esc(r.un||r.ue)}</b>
          <span class="tag" style="margin:0;background:${r.st=='approved'?'var(--up)':r.st=='rejected'?'var(--dn)':'var(--ac)'};color:${r.st=='rejected'?'#fff':'#04110e'}">${r.st.toUpperCase()}</span>
        </div>
        <small class="mu" style="display:block;margin-top:4px">${esc(r.ue)} · ${new Date(r.t).toLocaleString()}</small>
        <div style="margin-top:8px;font-size:14px">
          <b>${(+r.a).toFixed(2)} USD</b> via <b>${esc(mn(r.m))}</b><br>
          <span class="mu">TrxID:</span> <b style="color:var(--ac);user-select:all">${esc(r.trx||"N/A")}</b>
        </div>
        ${r.img?`<img src="${r.img}" class="thumb" onclick="viewImg(this.src)" title="Tap to zoom">`:`<small class="mu" style="display:block;margin-top:6px">No screenshot uploaded</small>`}
        ${r.st=="pending"?`<div style="display:flex;gap:8px;margin-top:10px">
          <button class="smbtn" style="flex:1;background:var(--up);color:#04110e" onclick="actReq('${r.id}','approved')">✓ Approve (+$${(+r.a).toFixed(0)})</button>
          <button class="smbtn" style="flex:1;background:var(--dn);color:#fff" onclick="actReq('${r.id}','rejected')">✕ Reject</button>
        </div>`:""}
      </div>`).join("");
    }
  } else {
    const uList=Object.entries(USERS);
    body+=uList.length?uList.map(([em,u])=>{
      let ub=0;try{const d=JSON.parse(localStorage.getItem(rk(em))||"null");if(d)ub=+d.bal||0}catch(e){}
      return `<div class="sw"><div><b>${esc(u.n)}</b><small class="mu" style="display:block">${esc(em)}</small></div><b>${ub.toFixed(2)} USD</b></div>`;
    }).join(""):`<p class="mu">No registered users.</p>`;
  }

  body+=`<button class="btn" style="width:100%;margin-top:14px;background:var(--card2);color:var(--tx)" onclick="wClose()">Close</button>`;
  wb(body);
}

function saveAdmPay(){
  const c={
    bkash:($("#cfg_bkash").value||"").trim(),
    nagad:($("#cfg_nagad").value||"").trim(),
    usdt:($("#cfg_usdt").value||"").trim(),
    pin:($("#cfg_pin").value||"1234").trim()||"1234",
    auto:$("#cfg_auto").checked
  };
  savePayCfg(c);
  toast("Payment numbers & settings saved!");
  admOpen();
}

function actReq(id,status){
  const reqs=getReqs(),r=reqs.find(x=>x.id==id);
  if(!r||r.st!="pending")return;
  r.st=status;
  saveReqs(reqs);
  if(status=="approved"){
    let uData={bal:0,tx:[]};
    try{const d=JSON.parse(localStorage.getItem(rk(r.ue))||"null");if(d)uData=d}catch(e){}
    uData.bal=(+uData.bal||0)+(+r.a);
    uData.tx=Array.isArray(uData.tx)?uData.tx:[];
    uData.tx.unshift({id:r.id,k:"dep",a:+r.a,m:r.m,trx:r.trx,t:Date.now()});
    try{localStorage.setItem(rk(r.ue),JSON.stringify(uData))}catch(e){}
    if(me&&me.e==r.ue){
      AC.real.bal=uData.bal;
      RTX=uData.tx;
      if(mode=="real"){bal=uData.bal;lastB=bal}
    }
    toast("Approved! +"+(+r.a).toFixed(2)+" USD added.");
  } else {
    toast("Request rejected.");
  }
  admOpen();
}

function wHist(){W={k:"h"};wDraw()}
async function wGo(n){const w=W;wb(`<div style="text-align:center;padding:56px 0"><span class="spin" style="width:32px;height:32px;border-width:3px"></span></div>`);await sleep(300);if(W!==w)return;w.st=n;wDraw()}
const stp=n=>`<div style="display:flex;gap:6px;margin:0 0 6px">${[1,2,3,4].map(i=>`<i style="flex:1;height:4px;border-radius:9px;background:${i<=n?"var(--ac)":"var(--card2)"}"></i>`).join("")}</div><div class="mu" style="font-size:12px;margin-bottom:12px">Step ${n} of 4</div>`;
function wQ(v){$("#wa").value=W.k=="dep"?v:(Math.floor(mx()*v)/100).toFixed(2)}
function wS1(){const a=+$("#wa").value;if(!(a>0))return toast("Enter an amount");if(a<10)return toast("Minimum is 10 USD");if(W.k=="dep"&&a>50000)return toast("Max 50,000 USD per deposit");if(W.k=="wd"&&a>mx())return toast("Exceeds available balance");W.a=a;wGo(2)}

function handleProofFile(inp){
  const file=inp.files&&inp.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      const c=document.createElement("canvas"),maxW=600,sc=Math.min(1,maxW/img.width);
      c.width=img.width*sc;c.height=img.height*sc;
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      W.img=c.toDataURL("image/jpeg",0.7);
      wDraw();
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

function wS3Go(){
  if(W.k=="dep"){
    const trx=($("#wtrx").value||"").trim();
    if(!trx)return toast("Please enter Transaction ID (TrxID)");
    if(!W.img)return toast("Please upload payment screenshot");
    W.trx=trx;
  } else {
    const acc=($("#wacc").value||"").trim();
    if(!acc)return toast("Enter your receiving account number");
    W.acc=acc;
  }
  wRun();
}

function wDraw(){
  const w=W,d=w.k=="dep",T=d?"Deposit":"Withdraw",sim=`<span class="tag" style="margin:0 0 10px">SIMULATED · no real money moves</span>`,nx=(l,fn)=>`<div style="display:flex;gap:10px;margin-top:16px"><button class="btn" style="flex:1;background:var(--card2);color:var(--tx)" onclick="${w.st>1?"wGo("+(w.st-1)+")":"wClose()"}">${w.st>1?"Back":"Cancel"}</button><button class="btn" style="flex:2" onclick="${fn}">${l}</button></div>`,r=(a,b)=>`<div class="sw"><span class="mu">${a}</span><b>${b}</b></div>`;
  const cfg=getPayCfg(),myReqs=getReqs().filter(x=>me&&x.ue==me.e);

  if(w.k=="h"){
    wb(`<h2 style="margin:0 0 12px;text-align:center">Transactions & Requests</h2>`
    +(myReqs.length?`<div class="mu" style="font-size:12px;margin-bottom:6px">Deposit Requests</div>`+myReqs.map(t=>`<div class="sw"><div><b>Deposit (${esc(mn(t.m))})</b> <span class="tag" style="font-size:10px;padding:2px 7px">${t.st}</span><small class="mu" style="display:block">TrxID: ${esc(t.trx)} · ${new Date(t.t).toLocaleString()}</small></div><b class="up">+${(+t.a).toFixed(2)} USD</b></div>`).join(""):"")
    +(RTX.length?`<div class="mu" style="font-size:12px;margin:10px 0 6px">Completed History</div>`+RTX.slice(0,20).map(t=>`<div class="sw"><div><b>${t.k=="dep"?"Deposit":"Withdrawal"}</b><small class="mu" style="display:block">${new Date(t.t).toLocaleString()} · ${t.id}</small></div><b class="${t.k=="dep"?"up":"dn"}">${t.k=="dep"?"+":"−"}${t.a.toFixed(2)} USD</b></div>`).join(""):"")
    +(!myReqs.length&&!RTX.length?`<p class="mu" style="text-align:center">No transactions yet.</p>`:"")
    +`<button class="btn" style="width:100%;margin-top:14px" onclick="wClose()">Close</button>`);
    return;
  }

  if(w.st==1)wb(sim+`<h2 style="margin:0 0 4px">${T}</h2>`+stp(1)+`<label class="mu" style="font-size:13px">Amount (USD)</label><input class="in" id="wa" type="number" step="any" inputmode="decimal" placeholder="0.00" value="${w.a}">`+(d?"":`<p class="mu" style="font-size:12px;margin-top:6px">Available: ${mx().toFixed(2)} USD</p>`)+`<div class="hs" style="margin-top:10px">${(d?AMT:[25,50,75,100]).map(v=>`<span class="tag" style="cursor:pointer;white-space:nowrap" onclick="wQ(${v})">${d?"$"+v:v+"%"}</span>`).join("")}</div>`+nx("Continue","wS1()"));
  else if(w.st==2)wb(sim+`<h2 style="margin:0 0 4px">${d?"Pay with":"Send to"}</h2>`+stp(2)+MT.map(m=>`<div class="row" style="${w.m==m[0]?"outline:2px solid var(--ac)":""}" onclick="W.m='${m[0]}';wDraw()"><div><b>${m[1]} ${m[2]}</b><small>${m[3]}</small></div></div>`).join("")+nx("Continue","W.m?wGo(3):toast('Choose a method')"));
  else if(w.st==3){
    if(d){
      const payNum=cfg[w.m]||"Not set by Admin";
      wb(sim+`<h2 style="margin:0 0 4px">Send Payment & Proof</h2>`+stp(3)
      +`<div class="paybox">
          <div class="mu" style="font-size:12px">Send <b>${w.a.toFixed(2)} USD</b> to this <b>${mn(w.m)}</b> number:</div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px;gap:8px">
            <b style="font-size:15px;word-break:break-all;color:var(--ac)">${esc(payNum)}</b>
            <button class="copybtn" onclick="copyTxt('${esc(payNum)}')">Copy</button>
          </div>
        </div>
        <label class="mu" style="font-size:13px;display:block;margin-top:8px">Transaction ID (TrxID) *</label>
        <input class="in" id="wtrx" placeholder="e.g. 9H7K2L8P" value="${esc(w.trx)}" oninput="W.trx=this.value">
        <label class="mu" style="font-size:13px;display:block;margin-top:10px">Payment Screenshot *</label>
        <input class="in" type="file" accept="image/*" onchange="handleProofFile(this)" style="padding:8px;font-size:13px">
        ${w.img?`<img src="${w.img}" class="thumb" onclick="viewImg(this.src)">`:""}`
      +nx("Submit Deposit","wS3Go()"));
    } else {
      wb(sim+`<h2 style="margin:0 0 4px">Review Withdrawal</h2>`+stp(3)+r("Type",T)+r("Amount",w.a.toFixed(2)+" USD")+r("Method",mn(w.m))+r("Fee","0.00 USD")
      +`<label class="mu" style="font-size:13px;display:block;margin-top:10px">Your ${mn(w.m)} Number / Address *</label>
        <input class="in" id="wacc" placeholder="Enter receiving account" value="${esc(w.acc)}" oninput="W.acc=this.value">`
      +nx("Confirm Withdraw","wS3Go()"));
    }
  }
}

async function wRun(){
  const w=W,d=w.k=="dep",L=d?["Verifying TrxID format","Uploading payment screenshot","Submitting to Admin Panel","Finalizing request"]:["Checking free margin","Security check","Sending to "+mn(w.m),"Updating your balance"];
  w.busy=1;
  for(let i=0;i<4;i++){
    wb(`<h2 style="margin:0 0 4px">Processing…</h2>`+stp(4)+`<div class="pb"><i style="width:${i*25}%"></i></div>`+L.map((t,j)=>`<div class="ls"><span class="${j==i?"spin":"d"}" style="${j<i?"background:var(--up);color:#04110e":j>i?"background:var(--card2)":""}">${j<i?"✓":""}</span><span class="${j>i?"mu":""}">${t}</span></div>`).join(""));
    await sleep(30);const pi=$(".pb i");if(pi)pi.style.width=(i+1)*25+"%";await sleep(600+Math.random()*300);if(W!==w)return;
    if(!d&&i==0&&w.a>mx()){w.busy=0;wb(`<div class="ok bad">✕</div><h2 style="text-align:center">Withdrawal failed</h2><p class="mu" style="text-align:center">Free margin changed. Available: ${mx().toFixed(2)} USD.</p><button class="btn" style="width:100%;margin-top:16px" onclick="wClose()">Close</button>`);return}
  }
  const id="TX"+Date.now().toString(36).toUpperCase();
  w.busy=0;
  if(d){
    const cfg=getPayCfg(),reqs=getReqs();
    const st=cfg.auto?"approved":"pending";
    reqs.unshift({id,ue:me.e,un:me.n,a:w.a,m:w.m,trx:w.trx,img:w.img,st,t:Date.now()});
    saveReqs(reqs);
    if(cfg.auto){
      bal+=w.a;RTX.unshift({id,k:"dep",a:w.a,m:w.m,trx:w.trx,t:Date.now()});lastB=bal;rSave();
      wb(`<div class="ok">✓</div><h2 style="text-align:center">Deposit Approved</h2><p class="mu" style="text-align:center;margin:6px 0">${w.a.toFixed(2)} USD added · TrxID: ${esc(w.trx)}<br>Ref ${id}</p><button class="btn" style="width:100%;margin-top:16px" onclick="wClose()">Done</button>`);
    } else {
      wb(`<div class="ok" style="background:var(--ac)">⏳</div><h2 style="text-align:center">Deposit Submitted</h2><p class="mu" style="text-align:center;margin:6px 0">${w.a.toFixed(2)} USD · ${mn(w.m)}<br>TrxID: <b>${esc(w.trx)}</b> · Ref ${id}<br><span style="font-size:12px">Waiting for Admin approval in Admin Panel.</span></p><button class="btn" style="width:100%;margin-top:16px" onclick="wClose()">Done</button>`);
    }
  } else {
    bal-=w.a;RTX.unshift({id,k:w.k,a:w.a,m:w.m,t:Date.now()});lastB=bal;rSave();
    wb(`<div class="ok">✓</div><h2 style="text-align:center">Withdrawal successful</h2><p class="mu" style="text-align:center;margin:6px 0">${w.a.toFixed(2)} USD · ${mn(w.m)}<br>Ref ${id}</p><button class="btn" style="width:100%;margin-top:16px" onclick="wClose()">Done</button>`);
  }
  if(cur==null)render();else upd();
}
function logout(){if(me&&mode=="real")rSave();try{localStorage.removeItem("tl_s")}catch(x){}if(cur!=null)closeChart();me=null;mode="demo";pos=[];closed=[];bal=10000;AC.real={bal:0,pos:[],closed:[]};RTX=[];W=null;admUnlocked=false;$("#wl").style.display="none";authView("in")}
render();
{let s0=null;try{s0=localStorage.getItem("tl_s")}catch(e){}if(s0&&USERS[s0]){me={n:USERS[s0].n,e:s0};loadReal()}else authView("in")}
</script></body></html>
